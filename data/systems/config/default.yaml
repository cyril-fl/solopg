name: "solopg"
verbose: false
i18n: 
  default: "fr"
  dir: "data/locales"
  format: "yaml"
  locales: 
    - code: en
      iso: "en-US"
      name: "English"
      file: "en-US.yaml"
    - code: fr
      iso: "fr-FR"
      name: Français
      file: "fr-FR.yaml"
commands: 
  config: 
    use: "config"
    short: "Display the configuration of SoloPG"
  root: 
    short: "SoloPG CLI"
    long: "SoloPG is a CLI to manage a solo RPG session in the terminal."
    example: |
      solopg run
      solopg load data/template/characters/hero.yaml
      solopg load data/template/characters/hero.yaml --verbose
      solopg load data/template/characters/hero.yaml -v
      solopg load data/template/characters/hero.yaml --verbose=true
      solopg load data/template/characters/hero.yaml --verbose=false
  run: 
    use: "run"
    short: "Run a solo RPG session"
  try: 
    use: "try"
    short: "Try a solo RPG session"
  version: 
    use: "version"
    short: "Display the version of SoloPG"
structure_files:
  dice: "data/systems/dice.yaml"
  objects_category: "data/systems/category.yaml"
  oracle: "data/template/systems/rules/oracles"
  portal: "data/template/locations"
  rarity: "data/systems/rarirty.yaml"
  stats: "data/systems/stats.yaml"
  variety: "data/systems/variety.yaml"