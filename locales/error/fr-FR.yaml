# Loading
error.loading:
  other: "Erreur de chargement \"{{.Subject}}\" :\n{{.Error}}"
error.loading:file:
  other: "Erreur de chargement du fichier \"{{.Subject}}\" {{.File}} :\n{{.Error}}"
error.loading:folder:
  other: "Erreur de chargement du dossier \"{{.Subject}}\" {{.Folder}} :\n{{.Error}}"
error.loading:campaign:
  other: "Erreur de chargement de la sauvegarde \"{{.Subject}}\" {{.ID}} :\n{{.Error}}"

# Invalid
error.invalid:
  other: "\"{{.Subject}}\" invalide : {{.Received}}"
error.invalid:form:
  other: "Erreur de validation du formulaire :\n{{.Error}}"
error.invalid:new:
  other: "\"{{.Subject}}\" n'a pas pu être créé :\n{{.Error}}"

# Not found
error.not_found:
  other: "\"{{.Subject}}\" introuvable"
error.not_found.id:
  other: "\"{{.Subject}}\" {{.ID}} introuvable"
error.not_found:id-error:
  other: "\"{{.Subject}}\" {{.ID}} introuvable :\n{{.Error}}"
error.not_found:on_save:
  other: "Fonction de sauvegarde non configurée"

# Required
error.required:
  other: "Le champ {{.Property}} est requis pour \"{{.Subject}}\""

# Unexpected 
error.unexpected:
 other: "Une erreur inattendue est survenue à {{.Path}} :\n{{.Error}}"
error.unexpected:action:
  other: "Erreur durant l'exécution de \"{{.Action}}\" :\n{{.Error}}"
error.unexpected:save:
  other: "Erreur de sauvegarde :\n{{.Error}}"
error.unexpected:value:
  other: "Type invalide pour \"{{.Subject}}\", attendu : {{.Expected}}, reçu : {{.Received}}"