services:
  app:
    image: golang:latest
    working_dir: /app
    volumes:  
      - .:/app
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    env_file:
      - .env.docker
    command: sleep infinity

  mongo:
    image: mongo:latest
    container_name: solopg-mongo
    ports:
      - "${PORT:-27017}:27017"
    # environment:
    #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
    #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

  compooss:
    image: abdullahmia/compooss:latest
    ports:
        - "6969:3000"
    depends_on:
        - mongo

volumes:
  mongo-data:
  mongo-config: